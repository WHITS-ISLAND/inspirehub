name: Terraform Infrastructure

on:
  workflow_dispatch:

env:
  TERRAFORM_VERSION: "1.14.0"
  TF_IN_AUTOMATION: true

permissions:
  contents: write # git pushのために必要
  pull-requests: write
  issues: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: develop
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terraform Cloud
        run: |
          cat > ~/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TF_API_TOKEN }}"
          }
          EOF

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/develop
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure/terraform/environments/develop
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infrastructure/terraform/environments/develop
        run: |
          terraform plan -detailed-exitcode -out=tfplan > plan_output.txt 2>&1
          exitcode=$?
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          echo "Terraform Plan exit code: $exitcode"

          # Terraform Cloudでは detailed-exitcode が正しく動作しない場合があるため、
          # 出力を解析して変更があるかチェック
          if grep -q "Plan:" plan_output.txt && grep -q "to add\|to change\|to destroy" plan_output.txt; then
            echo "Changes detected in plan output"
            echo "exitcode=2" >> $GITHUB_OUTPUT
          fi

          cat plan_output.txt
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_client_url: ${{ secrets.CLIENT_URL }}
          TF_VAR_custom_domain: ${{ secrets.CUSTOM_DOMAIN }}
          TF_VAR_web_custom_domain: ${{ secrets.WEB_CUSTOM_DOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_access_secret: ${{ secrets.JWT_ACCESS_SECRET }}
          TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET }}

  update-config:
    name: Update Configuration
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: develop
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terraform Cloud
        run: |
          cat > ~/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TF_API_TOKEN }}"
          }
          EOF

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/develop
        run: terraform init

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: infrastructure/terraform/environments/develop
        run: |
          D1_DATABASE_ID=$(terraform output -raw d1_database_id)
          D1_DATABASE_NAME=$(terraform output -raw d1_database_name)
          echo "d1_database_id=$D1_DATABASE_ID" >> $GITHUB_OUTPUT
          echo "d1_database_name=$D1_DATABASE_NAME" >> $GITHUB_OUTPUT
          echo "D1 Database ID: $D1_DATABASE_ID"
          echo "D1 Database Name: $D1_DATABASE_NAME"

      - name: Update wrangler.jsonc with Configuration
        run: |
          cat > apps/api/wrangler.jsonc << EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "inspirehub-api",
            "main": "./src/index.tsx",
            "compatibility_date": "2024-09-23",
            "compatibility_flags": ["nodejs_compat_v2"],

            "routes": [
              {
                "pattern": "api.inspirehub.wtnqk.org/*",
                "zone_id": "${{ secrets.CLOUDFLARE_ZONE_ID }}"
              }
            ],

            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "${{ steps.tf_outputs.outputs.d1_database_name }}",
                "database_id": "${{ steps.tf_outputs.outputs.d1_database_id }}"
              }
            ],

            "vars": {
              "ENVIRONMENT": "develop",
              "CLIENT_URL": "${{ secrets.CLIENT_URL }}",
              "API_URL": "https://api.inspirehub.wtnqk.org"
            }
          }
          EOF

      - name: Commit updated wrangler.jsonc
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/api/wrangler.jsonc
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update wrangler.jsonc with latest configuration

            🤖 Generated with [Claude Code](https://claude.ai/code)

            Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin HEAD:${{ github.ref_name }}
          fi

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: develop
    # 手動実行時に変更がある場合のみ実行
    if: |
      needs.terraform-plan.outputs.exitcode == '2' &&
      github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terraform Cloud
        run: |
          cat > ~/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TF_API_TOKEN }}"
          }
          EOF

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/develop
        run: terraform init

      - name: Import existing resources
        working-directory: infrastructure/terraform/environments/develop
        continue-on-error: true
        run: |
          # Import Workers custom domain if not in state
          if ! terraform state show 'cloudflare_workers_domain.api[0]' 2>/dev/null; then
            echo "Importing cloudflare_workers_domain.api[0]..."
            terraform import 'cloudflare_workers_domain.api[0]' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/${{ secrets.CLOUDFLARE_ZONE_ID }}/${{ secrets.CUSTOM_DOMAIN }}" || true
          fi
          # Import Pages custom domain if not in state
          if ! terraform state show 'cloudflare_pages_domain.web[0]' 2>/dev/null; then
            echo "Importing cloudflare_pages_domain.web[0]..."
            terraform import 'cloudflare_pages_domain.web[0]' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/inspirehub-web/${{ secrets.WEB_CUSTOM_DOMAIN }}" || true
          fi
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_client_url: ${{ secrets.CLIENT_URL }}
          TF_VAR_custom_domain: ${{ secrets.CUSTOM_DOMAIN }}
          TF_VAR_web_custom_domain: ${{ secrets.WEB_CUSTOM_DOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_access_secret: ${{ secrets.JWT_ACCESS_SECRET }}
          TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET }}

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/develop
        run: terraform apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_client_url: ${{ secrets.CLIENT_URL }}
          TF_VAR_custom_domain: ${{ secrets.CUSTOM_DOMAIN }}
          TF_VAR_web_custom_domain: ${{ secrets.WEB_CUSTOM_DOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_access_secret: ${{ secrets.JWT_ACCESS_SECRET }}
          TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET }}

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: infrastructure/terraform/environments/develop
        run: |
          D1_DATABASE_ID=$(terraform output -raw d1_database_id)
          D1_DATABASE_NAME=$(terraform output -raw d1_database_name)
          echo "d1_database_id=$D1_DATABASE_ID" >> $GITHUB_OUTPUT
          echo "d1_database_name=$D1_DATABASE_NAME" >> $GITHUB_OUTPUT
          echo "D1 Database ID: $D1_DATABASE_ID"
          echo "D1 Database Name: $D1_DATABASE_NAME"

      - name: Update wrangler.jsonc with D1 Database ID
        run: |
          cat > apps/api/wrangler.jsonc << EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "inspirehub-api",
            "main": "./src/index.tsx",
            "compatibility_date": "2024-09-23",
            "compatibility_flags": ["nodejs_compat_v2"],

            "routes": [
              {
                "pattern": "api.inspirehub.wtnqk.org/*",
                "zone_id": "${{ secrets.CLOUDFLARE_ZONE_ID }}"
              }
            ],

            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "${{ steps.tf_outputs.outputs.d1_database_name }}",
                "database_id": "${{ steps.tf_outputs.outputs.d1_database_id }}"
              }
            ],

            "vars": {
              "ENVIRONMENT": "develop",
              "CLIENT_URL": "${{ secrets.CLIENT_URL }}",
              "API_URL": "https://api.inspirehub.wtnqk.org"
            }
          }
          EOF

      - name: Commit updated wrangler.jsonc
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/api/wrangler.jsonc
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update wrangler.jsonc with D1 database ID from Terraform

            🤖 Generated with [Claude Code](https://claude.ai/code)

            Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin HEAD:${{ github.ref_name }}
          fi
