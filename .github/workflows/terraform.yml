name: Terraform Infrastructure

on:
  workflow_dispatch:

env:
  TERRAFORM_VERSION: "1.6.0"
  TF_WORKSPACE: "develop"
  TF_IN_AUTOMATION: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: develop
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terraform Cloud
        run: |
          cat > ~/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TF_API_TOKEN }}"
          }
          EOF

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/production
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure/terraform/environments/production
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infrastructure/terraform/environments/production
        run: |
          terraform plan -detailed-exitcode -out=tfplan || export exitcode=$?
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_client_url: ${{ secrets.CLIENT_URL }}
          TF_VAR_custom_domain: ${{ secrets.CUSTOM_DOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_access_secret: ${{ secrets.JWT_ACCESS_SECRET }}
          TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET }}


  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: develop
    # 手動実行時に変更がある場合のみ実行
    if: |
      needs.terraform-plan.outputs.exitcode == '2' &&
      github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terraform Cloud
        run: |
          cat > ~/.terraformrc << EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TF_API_TOKEN }}"
          }
          EOF

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/production
        run: terraform init

      - name: Terraform Apply
        working-directory: infrastructure/terraform/environments/production
        run: terraform apply -auto-approve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_client_url: ${{ secrets.CLIENT_URL }}
          TF_VAR_custom_domain: ${{ secrets.CUSTOM_DOMAIN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_jwt_access_secret: ${{ secrets.JWT_ACCESS_SECRET }}
          TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET }}

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: infrastructure/terraform/environments/production
        run: |
          D1_DATABASE_ID=$(terraform output -raw d1_database_id)
          echo "d1_database_id=$D1_DATABASE_ID" >> $GITHUB_OUTPUT
          echo "D1 Database ID: $D1_DATABASE_ID"

      - name: Update wrangler.toml with D1 Database ID
        run: |
          # wrangler.tomlのdevelop環境にdatabase_idを設定
          cat > temp_wrangler.toml << EOF
          name = "inspirehub-api"
          main = "src/index.tsx"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat_v2"]

          [env.develop]
          vars = { ENVIRONMENT = "develop" }
          route = { pattern = "api.inspirehub.wtnqk.org/*", zone_name = "wtnqk.org" }

          [[env.develop.d1_databases]]
          binding = "DB"
          database_name = "inspirehub-production"
          database_id = "${{ steps.tf_outputs.outputs.d1_database_id }}"

          # D1 Database binding (ローカル開発用)
          [[d1_databases]]
          binding = "DB"
          database_name = "inspirehub"
          database_id = "local-inspirehub"

          # 環境変数（公開可能な値のみ）
          [vars]
          CLIENT_URL = "http://localhost:5173"
          EOF
          mv temp_wrangler.toml apps/api/wrangler.toml

      - name: Commit updated wrangler.toml
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add apps/api/wrangler.toml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update wrangler.toml with D1 database ID from Terraform

            🤖 Generated with [Claude Code](https://claude.ai/code)

            Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
          fi