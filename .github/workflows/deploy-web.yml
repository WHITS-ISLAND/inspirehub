name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - develop
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "develop"
        type: choice
        options:
          - develop

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    # PR時はマージされた時のみ実行
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment: ${{ github.event.inputs.environment || 'develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        working-directory: apps/web
        run: bun run build
        env:
          VITE_API_URL: https://api.inspirehub.wtnqk.org
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_APP_TITLE: InspireHub

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name inspirehub-web
          workingDirectory: apps/web
