name = "inspirehub-api"
main = "src/index.tsx"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

[env.develop]
vars = { ENVIRONMENT = "develop" }
route = { pattern = "api.inspirehub.wtnqk.org/*", zone_name = "wtnqk.org" }

[[env.develop.d1_databases]]
binding = "DB"
database_name = "inspirehub-d1"
database_id = "17c33eda-5d8d-4166-a1ac-b2278ec834a5"

# D1 Database binding (ローカル開発用)
[[d1_databases]]
binding = "DB"
database_name = "inspirehub"
database_id = "local-inspirehub"


# 環境変数（公開可能な値のみ）
# シークレットは .dev.vars（ローカル）または wrangler secret（本番）で設定
[vars]
CLIENT_URL = "http://localhost:5173"
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
# は .dev.vars または wrangler secret put で設定してください